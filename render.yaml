services:
  - type: web
    name: starforge-relay
    runtime: node
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FAL_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: VITE_APP_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VITE_CONVEX_URL
        sync: false
